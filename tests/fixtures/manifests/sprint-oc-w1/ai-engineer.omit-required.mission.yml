# yaml-language-server: $schema=../../../../src/mission_control/contracts/schemas/mc.mission_manifest.v1.json
# Sprint OC W1 (OVE-169 / WI-06), AI Engineer NEGATIVE: the required report is deliberately omitted
# (expected: typed unmet for root.report, visible expected/optional dispositions, terminal run).
#
# Frozen inputs (OC-D192): the task contract and two captured sources, one verbatim quote each
# (scripts/sprint_oc_w1_pack.mjs). The pack authors NO claim. The producer writes every assertion,
# support set and the report body; the host computes every KS record digest from that content
# (W1 fix D1). It submits four named promises:
#
#   report        reference  required  (KS report revision; independent judge + auditor through KS)
#   progress_note text       required  (the run's progress note)
#   summary       text       expected  (a shortfall is visible, never blocking)
#   caveats       text       optional  (absence is silent)
#
# Objective criteria: one assertion per source, stating exactly the parameter count the quote
# states for the named model; each claim cites only its own source fragment; no claim without a
# source (the auditor census finds any). `__PACK__` is replaced by the driver before compile.
manifest: mission/v1
mission:
  key: w1-omit-required
  title: W1 negative probe - omitted required report
  application: ai-engineer
  description: >
    Sprint OC W1 ordinary GoalDirected report. Small real knowledge task with frozen inputs.
  goals:
    - key: model_facts_report
      description: |
        W1 negative (omitted required output): do NOT register a report and do NOT submit "root.report".
        1 submit_output obligation "root.progress_note": inline text "Negative probe: the report is
        deliberately omitted."
        2 submit_output obligation "root.summary": inline text "No report was produced in this probe."
        Do not submit "root.caveats". Then stop.
      objectives:
        - key: register_report
          description: Register the report built only from the frozen sources and submit the named outputs
      criteria:
        - key: report_submitted
          description: The registered report revision is submitted for the report promise and independently assessed
          evidence: [report, progress_note]
          acceptance: { human: review_accept }
  environment:
    lane: deep_agents
    model: { profile: __PRODUCER__ }
    sandbox: { profile: research.standard }
    capabilities:
      # Exact pins (seed mc.catalog.knowledge-tools@1.0.0), not `search`: hybrid search fails on the
      # restricted runtime login (W1 finding D7).
      - { pin: "tool.knowledge-report-register@1#sha256:69e840eb7606d45285d5ebeb3ffe8a759353d4a3b7e495dfb2eb9c994b0474d2", kind: tool, as: report_register }
      - { pin: "tool.knowledge-submit-output@2#sha256:f1fa75f1e3fa49e9061746cbe89f53a828e502fb93e142d3b34d8a854a2a64dd", kind: tool, as: submit_output }
    budget: { usd: 1, tokens: 300000, wall_clock: 30m, tool_calls: 20 }
    governors: { depth: 1, fan_out: 1, iterations: 1, patience: 1 }
    side_effects: [read_only, workspace_write, external_write_reversible]
  program:
    key: root
    behavior: goal_loop
    objective: model_facts_report
    action_space: [root]
    verifier:
      independent: true
      environment:
        model: { profile: producer.fallback }
    outputs:
      - name: report
        form: reference
        enforcement: required
        requirements:
          - { key: assessed, validator: "knowledge.report.assess@1" }
      - { name: progress_note, form: text, enforcement: required, media_type: text/plain, scope: iteration }
      - { name: summary, form: text, enforcement: expected, media_type: text/plain, scope: iteration }
      - { name: caveats, form: text, enforcement: optional, media_type: text/plain, scope: iteration }
  controls:
    commands_allowed: [pause, resume, cancel]
