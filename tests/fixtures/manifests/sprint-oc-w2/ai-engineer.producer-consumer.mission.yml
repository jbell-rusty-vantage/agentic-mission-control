# yaml-language-server: $schema=../../../../src/mission_control/contracts/schemas/mc.mission_manifest.v1.json
# Sprint OC W2 (OVE-171 / WI-08), AI Engineer: exact transfer from a producer stage to a consumer.
#
# `produce` is the W1 report (same frozen pack, same named promises, positioned `produce.*`).
# `consume` declares ONE explicit binding `{name: report, from: produce.report}` and NO
# `depends_on`: the binding is its own dependency (no depends_on-only side path). Its sealed plan
# holds exactly the accepted report revision the release selected; `consume` reads it through
# `knowledge_read` and submits a short comparison. It refuses to start on a held (non-accepted)
# revision. Placeholders the driver replaces before compile: __PACK__, __PRODUCER__, __CONSUMER__.
manifest: mission/v1
mission:
  key: w2-open-model-facts-transfer
  title: W2 producer to consumer exact transfer (frozen W1 evidence)
  application: ai-engineer
  description: >
    Sprint OC W2 two-stage Stage Graph. The consumer reads exactly the selected report revision.
  goals:
    - key: model_facts_report
      description: Register the W1 sourced report from the frozen pack and submit its named outputs
      objectives:
        - key: register_report
          description: Register the report built only from the frozen sources and submit the named outputs
      criteria:
        - key: report_submitted
          description: The registered report revision is submitted for the report promise and independently assessed
          evidence: [report, progress_note]
          acceptance: { human: review_accept }
    - key: report_comparison
      description: Read the exact selected report revision and summarize what it states
      objectives:
        - key: compare_report
          description: Read the report revision named in /.mission/inputs.json and submit a comparison
      criteria:
        - key: comparison_submitted
          description: The comparison names the report revision it read and states its findings
          evidence: [comparison]
          acceptance: { human: review_accept }
  environment:
    lane: deep_agents
    model: { profile: __PRODUCER__ }
    sandbox: { profile: research.standard }
    capabilities:
      # Exact pins (seed mc.catalog.knowledge-tools@1.0.0), not `search` (W1 finding D7).
      - { pin: "tool.knowledge-report-register@1#sha256:69e840eb7606d45285d5ebeb3ffe8a759353d4a3b7e495dfb2eb9c994b0474d2", kind: tool, as: report_register }
      - { pin: "tool.knowledge-read@1#sha256:4d3e11e5d12ee6bb8bfa6e6c79cde3a8e42f199e2de14839c6363d86df6ebe8e", kind: tool, as: knowledge_read }
      - { pin: "tool.knowledge-submit-output@2#sha256:f1fa75f1e3fa49e9061746cbe89f53a828e502fb93e142d3b34d8a854a2a64dd", kind: tool, as: submit_output }
    budget: { usd: 1.5, tokens: 400000, wall_clock: 45m, tool_calls: 30 }
    governors: { depth: 1, fan_out: 1, iterations: 1, patience: 1 }
    side_effects: [read_only, workspace_write, external_write_reversible]
  program:
    key: root
    behavior: stage_graph
    objectives: [model_facts_report, report_comparison]
    nodes:
      - key: produce
        behavior: agent_executor
        objectives: [register_report]
        instruction: |
          Report, for each pack fragment, the parameter count its quote states for the model it names.
          Use only the quotes; you author every claim; never write digest/tenant/binding/schemaVersion/producer; record ids MUST
          start with pack.reportId (ids are write-once across runs).
          1 Assertions, one per fragment: {"id":"<reportId>-asr-N","logicalId":"<slug>-size","proposition":"..",
          "kind":"source_report","value":{"type":"quantity","amount":"<digits>","unit":"parameters"},
          "subject":"<slug>","object":null,"riskReasons":[],"premises":[],"qualifiers":{"profile":
          "engineering.v2","entity":"<slug>","unit":"parameters","negation":false,"modality":"asserted",
          + null population,time,jurisdiction,baseline,comparison,runtime,softwareVersion,configuration,
          benchmarkEnvironment,denominator,repositoryCommit}}.
          2 Support sets: {"id":"<reportId>-ss-N","assertion":"<reportId>-asr-N","provenance":"declared_citation","required":
          [{"premise":"size","evidence":["<fragment id>"],"derivedFrom":[]}],"contrary":[]}.
          3 Body {"sections":[..]}: EXACTLY four sections, ids scope, findings, evidence, limitations, in that order; section {"id","heading":
          [{"type":"text","text":".."}],"headingExcludedReason":"section title","blocks":[..]}; block
          {"type":"paragraph","id":"pK","inlines":[..],"excludedReason":"<why framing>"}. Evidence section:
          one framing paragraph citing each fragment. Findings (excludedReason MUST be null): one
          paragraph per assertion, inlines [{"type":"claim","occurrenceId":"occ-N",
          "assertion":"<reportId>-asr-N","text":"..","obligations":["finding.size"],"attribution":".."},{"type":"text",
          "text":" "},{"type":"citation","label":"..","fragment":"<fragment id>"}]. No claim elsewhere.
          4 Call report_register ONCE. Its single argument "report" is a JSON object (not a string) with
          exactly five keys: "task" (pack.task as given), "fragments" (pack.fragments as given), "assertions",
          "supportSets", and "report" = {"reportId":<pack.reportId>,"revision":1,"kind":"evidence_report",
          "structuredBody":<body>}. On a refusal, fix the named fields and append "-r2" to assertion/support-set ids before one retry; the result
          carries a handle only on success; never invent a handle or digest.
          5 submit_output obligation "produce.report": [{"kind":"handle","ref":<report handle>,"digest":<digest>}].
          6 submit_output obligation "produce.progress_note": inline text, what you did and what remains.
          7 submit_output obligation "produce.summary": inline text, one sentence per model.
          Stop; never repeat a call that returned a receipt.

          FROZEN PACK (task and sources, JSON): __PACK__
        outputs:
          - name: report
            form: reference
            enforcement: required
            requirements:
              - { key: assessed, validator: "knowledge.report.assess@1" }
          - { name: progress_note, form: text, enforcement: required, media_type: text/plain }
          - { name: summary, form: text, enforcement: expected, media_type: text/plain }
      - key: consume
        behavior: agent_executor
        objectives: [compare_report]
        environment:
          model: { profile: __CONSUMER__ }
          budget: { usd: 0.3, tokens: 120000, wall_clock: 15m, tool_calls: 8 }
        inputs:
          # The binding alone orders `consume` after `produce` (OVE-171 cutover).
          - { name: report, from: produce.report, expand: reference }
        instruction: |
          Your only input is the exact accepted report revision listed under binding "report" in /.mission/inputs.json.
          1 Read it ONCE with knowledge_read using exactly the handle the index names (never another
          revision, never a search). Preserve the index handle, digest and revision in your comparison. If the read is refused, stop and report the refusal; never guess.
          2 submit_output obligation "consume.comparison": inline text, at most four sentences: the
          report id and revision you read, then each model and the parameter count the report states.
          Stop; never repeat a call that returned a receipt.
        outputs:
          - { name: comparison, form: text, enforcement: required, media_type: text/plain }
      # Human criteria need a qualified human evaluator at launch (completion_support.py; compile
      # reports them as start blockers since OVE-169): this final REVIEW gate owns every goal.
      - key: review
        behavior: human_gate
        objectives: [model_facts_report, report_comparison]
        depends_on: [consume]
        task:
          kind: REVIEW
          prompt: Review the exact report, its progress note and the consumer's comparison.
          reviewers: [owner]
          packet: [produce.report, produce.progress_note, consume.comparison]
          on_timeout: keep_waiting
  controls:
    commands_allowed: [pause, resume, cancel]
