# yaml-language-server: $schema=../../../../src/mission_control/contracts/schemas/mc.mission_manifest.v1.json
# Experiment loop E5 (EXPERIMENT-LOOP-2026-11 section 3, OVE-169): nested Goal Loop in a Stage Graph.
#
# Derived from sprint-oc-w5/ai-engineer.goal-in-graph.mission.yml, three stages:
#   prepare   agent stage: a one-line scope note (gives the graph a stage BEFORE the nested body,
#             so a fork "after the nested stage" has an upstream checkpoint to keep)
#   research  nested Goal Loop body (its own child run, iteration governor, budget account inside
#             the stage reservation, independent verifier); exports `report` (final) and
#             `progress_note` (early)
#   compare   agent stage binding the exported report exactly (reference, read by knowledge_read)
#   review    human_gate REVIEW owning the parent's human criteria
#
# Differences from the W5 fixture, each a defect there:
# - W5 `action_space: [register_report]` names an objective, not a capability: full compile
#   refuses it (`unresolved_action_space`); here the loop's action space is its tool aliases.
# - W5 puts the frozen pack in a trailing YAML comment, which no model ever sees; here the W1
#   instruction and `__PACK__` are the `register_report` objective description, which lowering
#   uses as the loop's initial goal (`manifest_lowering.py::_goal_text`).
# - W5 human criteria are owned by agent/goal-loop stages, which have no qualified human
#   evaluator at launch (`completion_support.py`); here a final REVIEW gate owns them.
# Placeholder the driver replaces before compile: __PACK__ (scripts/sprint_oc_w1_pack.mjs).
# Overlay: fork from a cognition point after the nested stage.
manifest: mission/v1
mission:
  key: e5-nested-goal-in-graph
  title: E5 nested Goal Loop in a Stage Graph (frozen evidence)
  application: ai-engineer
  description: >
    Experiment loop E5. A Goal Loop body iterates on the report inside the `research` stage; the
    consumer reads exactly the exported, accepted revision.
  goals:
    - key: scoped
      description: State the scope of the report before research starts
      objectives:
        - { key: scope_note, description: Write the one-line scope note }
      criteria:
        - { key: scope_submitted, description: The scope note is submitted, evidence: [scope], acceptance: { human: review_accept } }
    - key: model_facts_report
      description: Register the sourced report from the frozen pack, iterating until it is accepted
      objectives:
        - key: register_report
          description: |
            Report, for each pack fragment, the parameter count its quote states for the model it names.
            Use only the quotes; you author every claim; never write digest/tenant/binding/schemaVersion/producer; record ids MUST
            start with pack.reportId (ids are write-once across runs).
            1 Assertions, one per fragment: {"id":"<reportId>-asr-N","logicalId":"<slug>-size","proposition":"..",
            "kind":"source_report","value":{"type":"quantity","amount":"<digits>","unit":"parameters"},
            "subject":"<slug>","object":null,"riskReasons":[],"premises":[],"qualifiers":{"profile":
            "engineering.v2","entity":"<slug>","unit":"parameters","negation":false,"modality":"asserted",
            + null population,time,jurisdiction,baseline,comparison,runtime,softwareVersion,configuration,
            benchmarkEnvironment,denominator,repositoryCommit}}.
            2 Support sets: {"id":"<reportId>-ss-N","assertion":"<reportId>-asr-N","provenance":"declared_citation","required":
            [{"premise":"size","evidence":["<fragment id>"],"derivedFrom":[]}],"contrary":[]}.
            3 Body {"sections":[..]}: EXACTLY four sections, ids scope, findings, evidence, limitations, in that order; section {"id","heading":
            [{"type":"text","text":".."}],"headingExcludedReason":"section title","blocks":[..]}; block
            {"type":"paragraph","id":"pK","inlines":[..],"excludedReason":"<why framing>"}. Evidence section:
            one framing paragraph citing each fragment. Findings (excludedReason MUST be null): one
            paragraph per assertion, inlines [{"type":"claim","occurrenceId":"occ-N",
            "assertion":"<reportId>-asr-N","text":"..","obligations":["finding.size"],"attribution":".."},{"type":"text",
            "text":" "},{"type":"citation","label":"<letters, digits, _ or - only>","fragment":"<fragment id>"}]. No claim elsewhere.
            4 Call report_register ONCE. Its single argument "report" is a JSON object (not a string) with
            exactly five keys: "task" (pack.task as given), "fragments" (pack.fragments as given), "assertions",
            "supportSets", and "report" = {"reportId":<pack.reportId>,"revision":1,"kind":"evidence_report",
            "structuredBody":<body>}. On a refusal, fix the named fields AND append "-r2" to every assertion and support-set id,
            then call once more; the result carries a handle only on success; never invent a handle or digest.
            5 submit_output obligation "research.report": [{"kind":"handle","ref":<report handle>,"digest":<digest>}].
            6 submit_output obligation "research.progress_note": inline text, what you did and what remains.
            Stop; never repeat a call that returned a receipt. On a second iteration, fix only what the verifier names.

            FROZEN PACK (task and sources, JSON): __PACK__
      criteria:
        - key: report_submitted
          description: The registered report revision is submitted for the report promise and independently assessed
          evidence: [report, progress_note]
          acceptance: { human: review_accept }
    - key: report_comparison
      description: Read the exact exported report revision and summarize what it states
      objectives:
        - key: compare_report
          description: Read the report revision named in /.mission/transfer.json and submit a comparison
      criteria:
        - key: comparison_submitted
          description: The comparison names the report revision it read and states its findings
          evidence: [comparison]
          acceptance: { human: review_accept }
  environment:
    lane: deep_agents
    model: { profile: producer.fallback }
    sandbox: { profile: research.standard }
    capabilities:
      # Exact pins; digests identical in seeds mc.catalog.knowledge-tools 1.1.0 and 1.2.0.
      - { pin: "tool.knowledge-report-register@1#sha256:69e840eb7606d45285d5ebeb3ffe8a759353d4a3b7e495dfb2eb9c994b0474d2", kind: tool, as: report_register }
      - { pin: "tool.knowledge-read@1#sha256:4d3e11e5d12ee6bb8bfa6e6c79cde3a8e42f199e2de14839c6363d86df6ebe8e", kind: tool, as: knowledge_read }
      - { pin: "tool.knowledge-submit-output@2#sha256:f1fa75f1e3fa49e9061746cbe89f53a828e502fb93e142d3b34d8a854a2a64dd", kind: tool, as: submit_output }
    budget: { usd: 1.0, tokens: 600000, wall_clock: 60m, tool_calls: 44 }
    # depth bounds recursion: the nested loop is depth 1 (of at most 2 here).
    governors: { depth: 2, fan_out: 1, iterations: 2, patience: 1 }
    side_effects: [read_only, workspace_write, external_write_reversible]
  program:
    key: root
    behavior: stage_graph
    objectives: [scoped, model_facts_report, report_comparison]
    nodes:
      - key: prepare
        behavior: agent_executor
        objectives: [scope_note]
        environment:
          budget: { usd: 0.05, tokens: 40000, wall_clock: 10m, tool_calls: 4 }
        instruction: |
          Call submit_output ONCE, obligation "prepare.scope", one inline text line:
          "scope: parameter counts of mistral-7b and llama-3-1 from two frozen quotes".
          Stop; never repeat a call that returned a receipt.
        outputs:
          - { name: scope, form: text, enforcement: required, media_type: text/plain }
      - key: research
        behavior: goal_loop
        objectives: [register_report]
        objective: register_report
        action_space: [report_register, submit_output]
        depends_on: [prepare]
        verifier:
          independent: true
          environment:
            model: { profile: producer.fallback }
        environment:
          budget: { usd: 0.6, tokens: 360000, wall_clock: 40m, tool_calls: 28 }
          governors: { iterations: 2, patience: 1 }
        outputs:
          - name: report
            form: reference
            enforcement: required
            requirements:
              - { key: assessed, validator: "knowledge.report.assess@1" }
          - { name: progress_note, form: text, enforcement: required, media_type: text/plain }
        exports:
          - { output: progress_note, timing: early }
      - key: compare
        behavior: agent_executor
        objectives: [compare_report]
        environment:
          budget: { usd: 0.1, tokens: 80000, wall_clock: 15m, tool_calls: 6 }
        inputs:
          - { name: report, from: research.report, expand: reference }
        instruction: |
          Your only input is the report revision listed under binding "report" in /.mission/transfer.json.
          Read it ONCE with knowledge_read using exactly the handle the index names. If the read is
          refused, stop and report the refusal; never guess.
          submit_output obligation "compare.comparison": inline text, at most four sentences: the
          report id and revision you read, then each model and the parameter count it states.
          Stop; never repeat a call that returned a receipt.
        outputs:
          - { name: comparison, form: text, enforcement: required, media_type: text/plain }
      - key: review
        behavior: human_gate
        objectives: [scoped, model_facts_report, report_comparison]
        depends_on: [compare]
        task:
          kind: REVIEW
          prompt: Review the scope note, the exported report and progress note, and the comparison.
          reviewers: [owner]
          packet: [prepare.scope, research.report, research.progress_note, compare.comparison]
          on_timeout: keep_waiting
  controls:
    commands_allowed: [pause, resume, cancel, queue_instruction, add_context, fork]
