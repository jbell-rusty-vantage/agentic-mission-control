[parked]
paths = ["docs/specs/fault-tolerance-2026-10"]
line = "Parked (resumes on owner request): [Fault tolerance](docs/specs/fault-tolerance-2026-10/LEDGER.md)."

[knowledge_index]
intro = "Concepts explain how the code realizes the decisions: one concept per file, each citing source and tests, grouped by category. The code is what runs, the ADRs (docs/adr) are what was decided, the concepts explain both, and the program ledgers (docs/specs) are working documents. This file is generated by docs/tools/agents_docs_index.py from the concept frontmatter; each line is the concept's first question."
rules = "Every concept answers, where it applies, scheduling, output contract obligations, context transfer, and agent runtime and capability configuration, and ends with a Built / specified / goal line. Search: python docs/tools/okf_search.py; the update history is log.md."

[knowledge_index.categories]
boundaries = "What Mission Control owns and refuses, and where the applications and Knowledge Services begin."
surfaces = "How clients reach it: HTTP, the coordinator surface (MCP, missionctl, skills), streams, signals and search."
domain-model = "The mission model: manifests, lifecycle, the workflow systems (Stage Graph, Goal Loop, Parallel Swarm, Evaluator Optimizer, mission chains), output contracts, context transfer, revisions, interventions."
persistence = "The common database component, collections, closures, settlement and the transcript."
execution = "Providers and lanes: Deep Agents first (lane, configuration, children), Temporal synthesis, the harness protocol, other lanes, recovery, forks, watchers, capabilities and models."
qualification = "What the tests prove, evaluator attempts, trusted judgment and the retrieval fixtures."
operations = "Startup, environments, secrets, budgets, owner prerequisites and deployment."
decisions = "The ADR index by theme, open decisions and owner directives by date."
goals = "Where Mission Control is going: thresholds and requirements, never dates."
