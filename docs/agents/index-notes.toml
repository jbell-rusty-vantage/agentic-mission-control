# Config of docs/tools/agents_docs_index.py. It renders three marked blocks of the root AGENTS.md and the
# whole of docs/knowledge/index.md from this file, the concept frontmatter (category, title, questions[0]),
# the program ledgers and .sdlc/modules.json (the code map and every module AGENTS.md block). AGENTS.md loads on every turn, so every line here earns its bytes:
# budgets are the whole file 14 KiB, the sdlc block 8 KiB, programs 1 KiB, infra 400 B, hand-written 4 KiB.
# Edit this file or the concept frontmatter, then run `python docs/tools/agents_docs_index.py`.

[infra]
pointer = "Data planes, credentials, MCP servers: [workspace registry](../../docs/navigation/DATA-PLANES-AND-CREDENTIALS.md). Tooling: [DEVELOPMENT](docs/DEVELOPMENT.md); API and workers: [operator guide](docs/MISSION_CONTROL_LOCAL_API.md)."
commands = "`make dev` (compose up, healthy) · `make check` (fast gate) · `make preflight` (read-only installation check)."

[repository]
guide = "General Mission Control runtime and the common database component. Provider consolidation, one provider at a time; Deep Agents is the primary lane and the reference adapter shape (ADR-0005). Not here: application knowledge (`integrations/biotech`, never imported by the kernel), AI Engineer or Biotech schema authority, Knowledge Services internals."
search = 'Search: `python docs/tools/okf_search.py "<terms>"` (`--programs` adds active program documents) · retrieval fixtures: `.sdlc/fixtures/retrieval/`'

# Concepts named first inside their category (all other concepts follow alphabetically).
[pins]
execution = ["deep-agents-lane", "agent-configuration", "deep-agents-children", "temporal-synthesis", "lanes-and-harness"]
domain-model = ["workflow-systems", "stage-graph", "goal-loop", "parallel-swarm", "evaluator-optimizer", "mission-chains", "output-contracts", "context-and-continuation"]
boundaries = ["mission-control"]
decisions = ["decisions"]
goals = ["goals"]

[skills]
line = "start a session or place a fact: belllabs-method · find or update docs, truth pass: sdlc-docs · assert an MC fact: mission-control-docs · Deep Agents API: deep-agents-core · subagents or HITL: deep-agents-orchestration · unclear provider behaviour: provider-research · design before code: architecture-projection · interview the owner: grill-with-answers · build test-first: tdd · something broken: diagnosing-bugs · edit AGENTS.md or a skill: writing-for-agents"
tracker = "Tracker: Linear overtonbell/OVE, project Mission Control (docs/agents/issue-tracker.md) · labels: docs/agents/triage-labels.md · domain docs: single-context GLOSSARY.md and docs/adr (docs/agents/domain.md)"

[verify]
code = "Code: `make check` · `make typecheck` (mypy, authoritative) · `make test-integration` (real PostgreSQL and Temporal) · `uv run --group biotech pytest <selection>` (Biotech-domain tests)."
docs = "Docs: `make docs-check` (= `python docs/tools/check_docs.py`) · `python docs/tools/agents_docs_index.py --check` · `python docs/tools/bench_retrieval.py --gate`."

[[programs]]
name = "Provider consolidation"
path = "docs/specs/provider-consolidation-2026-10"
next = "Sprint OC W1: AI Engineer rerun, then Biotech ([NEXT-SESSION](docs/specs/provider-consolidation-2026-10/sprint-oc/NEXT-SESSION.md))"
