# Mission Control environment variables (names only; no value is stored here).
# Self-contained: docs/ENVIRONMENT.md is the prose companion. Scopes: the database variables
# (`MC_{AIENG,BIOTECH,LOCAL}_DB_*`, plane set), the GitHub credentials and the Biotech graph login.
# `make env-check` (scripts/dev/env_check.py) compares the database entries with the Settings
# fields and the database block of .env.example; the other entries are listed for readers.
# Plane selection: MISSION_CONTROL_APPLICATION ai-engineer -> AIENG, biotech -> BIOTECH, unset -> LOCAL.
# Reader paths are source file:line at the time of writing; the owner of a database name is Settings.db.
version: 1
variables:
  - name: MC_AIENG_DB_PROJECT_REF
    description: "Supabase project ref of the plane; must appear in the host or login of every sibling URL/DSN (checked at Settings construction). Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: ref
    secret: false
    plane: AIENG
    role: PROJECT_REF
    status: active
    readers:
      - src/mission_control/bootstrap/settings.py:154
      - src/mission_control/bootstrap/settings.py:762
  - name: MC_AIENG_DB_URL
    description: "Supabase project URL (storage, bundle custody, coordinator and Agent Server issuer). Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: url
    secret: false
    plane: AIENG
    role: URL
    status: active
    readers:
      - src/mission_control/bootstrap/settings.py:155
      - src/mission_control/bootstrap/settings.py:700
      - src/mission_control/adapters/supabase_storage/client.py:8
      - src/mission_control/adapters/supabase_storage/bundles.py:169
      - src/mission_control/bootstrap/bundle_custody.py:44
      - src/mission_control/bootstrap/worker_ingress.py:128
      - src/mission_control/adapters/agent_server/http_app.py:43
  - name: MC_AIENG_DB_PUBLISHABLE_KEY
    description: "Supabase publishable (anon) key; least-privilege client key. Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: key
    secret: false
    plane: AIENG
    role: PUBLISHABLE_KEY
    status: active
    readers:
      - src/mission_control/bootstrap/settings.py:156
      - src/mission_control/adapters/supabase_storage/client.py:9
      - src/mission_control/adapters/supabase_storage/bundles.py:465
  - name: MC_AIENG_DB_SECRET_KEY
    description: "Supabase secret (service) key; privileged client and checkpoint-signing fallback. Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: key
    secret: true
    plane: AIENG
    role: SECRET_KEY
    status: active
    readers:
      - src/mission_control/bootstrap/settings.py:157
      - src/mission_control/adapters/supabase_storage/client.py:9
      - src/mission_control/bootstrap/settings.py:712
  - name: MC_AIENG_DB_LEGACY_JWT_SECRET
    description: "Legacy HS256 JWT secret of the project; reserved, no Mission Control process reads it (the token-minting script takes it from an owner file by --secret-env). Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: key
    secret: true
    plane: AIENG
    role: LEGACY_JWT_SECRET
    status: reserved
    readers:
      - src/mission_control/bootstrap/settings.py:158
  - name: MC_AIENG_DB_ADMIN_DSN
    description: "Schema-owner (migration authority) login; the common-database connection. Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: dsn
    secret: true
    plane: AIENG
    role: ADMIN_DSN
    status: active
    readers:
      - src/mission_control/bootstrap/settings.py:159
      - src/mission_control/bootstrap/settings.py:661
      - src/mission_control/bootstrap/settings.py:677
      - src/mission_control/adapters/postgres/connections.py:46
  - name: MC_AIENG_DB_RUNTIME_DSN
    description: "Restricted non-bypass runtime login, a member of mission_control_runtime (the generated runtime env supplies it). Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: dsn
    secret: true
    plane: AIENG
    role: RUNTIME_DSN
    status: active
    readers:
      - src/mission_control/bootstrap/settings.py:160
      - src/mission_control/bootstrap/settings.py:667
      - src/mission_control/adapters/postgres/connections.py:59
      - src/mission_control/adapters/agent_server/http_app.py:65
      - src/mission_control/interfaces/http/run_control.py:208
      - src/mission_control/bootstrap/worker.py:300
  - name: MC_AIENG_DB_FAMILY_WRITER_DSN
    description: "Restricted login holding mission_control_family_writer; atomic family admission. Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: dsn
    secret: true
    plane: AIENG
    role: FAMILY_WRITER_DSN
    status: active
    readers:
      - src/mission_control/bootstrap/settings.py:161
      - src/mission_control/bootstrap/settings.py:690
      - src/mission_control/adapters/postgres/connections.py:81
      - src/mission_control/interfaces/http/run_control.py:216
  - name: MC_AIENG_DB_BACKFILL_DSN
    description: "Backfill member login; reserved, only Settings exposes it. Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: dsn
    secret: true
    plane: AIENG
    role: BACKFILL_DSN
    status: reserved
    readers:
      - src/mission_control/bootstrap/settings.py:162
      - src/mission_control/bootstrap/settings.py:682
  - name: MC_AIENG_DB_CHECKPOINT_DSN
    description: "Restricted login holding mission_control_checkpointer for the private mission_control_runtime schema; blank falls back to RUNTIME_DSN. Plane: AI Engineer (Supabase supabase-blue-ocean; MISSION_CONTROL_APPLICATION=ai-engineer)."
    kind: dsn
    secret: true
    plane: AIENG
    role: CHECKPOINT_DSN
    status: active
