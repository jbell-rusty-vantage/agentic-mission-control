  - name: MC_GITHUB_APP_ID
    description: "App id of the GitHub App agentic-mission-control-app on jbell-rusty-vantage (Contents RW, Pull requests RW, Metadata R); signs the installation-token exchange of the git write path. Source: BellLabs/.secrets/github.env."
    kind: id
    secret: false
    scope: github
    status: active
    readers:
      - src/mission_control/adapters/github/credentials.py:44
  - name: MC_GITHUB_APP_INSTALLATION_ID
    description: "Installation id of that App on the account; the exchange restricts each token to one target repository."
    kind: id
    secret: false
    scope: github
    status: active
    readers:
      - src/mission_control/adapters/github/credentials.py:45
  - name: MC_GITHUB_APP_PRIVATE_KEY_PATH
    description: "Path of the App's private key (.pem), outside every repository; the key file is the secret."
    kind: path
    secret: false
    scope: github
    status: active
    readers:
      - src/mission_control/adapters/github/credentials.py:46
  - name: MC_GITHUB_READONLY_TOKEN
    description: "Fine-grained read-only token (Contents R, Metadata R; one repository, jbell-rusty-vantage/mission-control-fixtures); the codex_agents pack vault credential GITHUB_TOKEN reads it by source_env."
    kind: token
    secret: true
    scope: github
    status: active
    readers:
      - deployments/hosted-packs/ai-engineer/codex_agents/pack.yaml:94
      - src/mission_control/adapters/openai_agents/prepare.py:322
