# Mission Control CI: the offline gate, and a production-shaped local stack that is brought up
# and evaluated through the consumer surface (HTTP API and the operator MCP mount).
#
# No secret is read and nothing outside the runner is contacted: PostgreSQL 17 + pgvector is a
# service container, Temporal is a dev server in a container, and every credential the stack
# uses is generated by `make local-install` for this run only.
#
# Actions are pinned by commit; the version each commit carries is in the trailing comment.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  # A plain log: no colour codes, and uv never prompts.
  NO_COLOR: "1"
  UV_NO_PROGRESS: "1"

jobs:
  gate:
    name: Offline gate (make ci)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Install the locked environment (runtime, dev, dbcontract, biotech)
        run: make install
      - name: Full offline gate
        run: make ci

  local-stack:
    name: Local stack (install, up, consumer evaluation)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # The same image, login and loopback port as the compose `application-postgres-17`
      # service, so `make local-install` finds it without any configuration. The password is
      # the tracked development placeholder of docker-compose.yml, not a secret.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: belllabs
          POSTGRES_USER: belllabs
          POSTGRES_PASSWORD: belllabs-local
        ports:
          - 127.0.0.1:55434:5432
        options: >-
          --health-cmd "pg_isready -U belllabs -d belllabs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      API_PORT: "8020"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Install the locked environment (runtime, dev, dbcontract, biotech)
        run: make install
      - name: Start a Temporal dev server on 127.0.0.1:7233
        # The image and version the compose stack pins (docker-compose.yml); its `temporal` CLI
        # carries the development server.
        run: >-
          docker run --detach --name temporal-dev --publish 127.0.0.1:7233:7233
          --entrypoint temporal temporalio/admin-tools:1.31.0
          server start-dev --ip 0.0.0.0 --port 7233 --headless
      - name: Prepare the local installation (database, component, seeds, logins, deployment)
        run: make local-install
      - name: Start the API and the worker
        # WORKER=auto: the worker starts only when its prerequisites outside this repository
        # (the capability resource owner's pinned modules) are present; the step output says
        # which were missing. The API must reach /health/ready or the job fails.
        run: make local-up PORT="${API_PORT}" WORKER=auto
      - name: Consumer-surface evaluation (a scorecard, not a gate)
        run: make local-eval
      - name: Component release proof on a locale database (real PostgreSQL)
        # The newest release installs fresh and over 1.15.0, and a capability search generation
        # whose ids sort differently under `en_US.utf8` and byte order activates (0075). It uses
        # throwaway `mct_*` databases on the same service container.
        env:
          MISSION_CONTROL_TEST_ADMIN_DSN: postgresql://belllabs:belllabs-local@127.0.0.1:55434/belllabs
        run: uv run --no-sync pytest tests/integration/postgres/test_capability_search_release_1160.py -q
      - name: Publish the scorecard in the job summary
        if: always()
        run: |
          card=.scratch/local-stack/ai-engineer/eval/scorecard.md
          if [ -f "$card" ]; then cat "$card" >> "$GITHUB_STEP_SUMMARY"; else echo "No scorecard was written." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: consumer-surface-scorecard
          path: .scratch/local-stack/ai-engineer/eval/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Stack status
        if: always()
        run: make local-status || true
      - name: Stop the stack
        if: always()
        run: |
          make local-down || true
          docker rm --force temporal-dev || true
